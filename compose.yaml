# Plain docker compose: SOAP on http://localhost:8080, SFTP on localhost:2222
# (user inge, password inge, drop directory Import).
services:
  dimag:
    build: ./dimag-sim
    ports:
      - "8080:8080"
    environment:
      DIMAG_SIM_VERSION: "3.5.0"
      DIMAG_SIM_PREFIX: sim
      DIMAG_SIM_URL: http://dimag
      # DIMAG works in local time; Inge sends local times to getObjectsChangedSince
      DIMAG_SIM_TIMEZONE: Europe/Berlin
      # user:password:display name:root AIDs[:admin]
      DIMAG_SIM_USERS: "inge:inge:Test User:sim-2;admin:admin:Test Admin:*:admin"
    volumes:
      - drop:/data/sftp/Import
      - state:/data/state

  dimag-sftp:
    build: ./dimag-sim/sftp
    ports:
      - "2222:22"
    environment:
      # user:password:uid[:dir]; the uid matches the dimag container (1000)
      DIMAG_SFTP_USERS: "inge:inge:1000:Import"
    volumes:
      - drop:/home/inge/Import
      - sftp-keys:/etc/ssh/keys

volumes:
  drop:
  state:
  sftp-keys:
