name: dimag-sim

# DDEV add-on: a simulated DIMAG (KM-SOAP + SFTP drop) next to the web container.
#   ddev add-on get kraenzle-ritter/dimag-sim
#   ddev restart
# SOAP inside the project network: http://dimag:8080/soap/webservice_3_5_0.php
# SFTP inside the project network: dimag-sftp:22, user inge / inge, drop Import

project_files:
  - docker-compose.dimag.yaml
  - dimag-sim/Dockerfile
  - dimag-sim/src
  - dimag-sim/public
  - dimag-sim/sftp
  - commands/web/dimag

ddev_version_constraint: '>= v1.24.0'

post_install_actions:
  - |
    #ddev-description:dimag-sim installed; run "ddev restart", then "ddev dimag status"
    echo "dimag-sim: SOAP http://dimag:8080/soap/webservice_3_5_0.php, SFTP dimag-sftp:22 (inge/inge, drop Import)"

removal_actions:
  - |
    #ddev-description:Remove dimag-sim volumes
    docker volume rm ddev-${DDEV_SITENAME}-dimag-drop ddev-${DDEV_SITENAME}-dimag-state ddev-${DDEV_SITENAME}-dimag-sftp-keys 2>/dev/null || true
